<!DOCTYPE html>
<html>
    <head>
        <title>My Django Blog</title>
    </head>
    <body>
        <h1>My Blog Posts</h1>

        {% for post in posts %}
            <div>
                <h2><a href="">{{ post.title }}</a></h2>
                <p>published: {{ post.published_date }}</p>
                <p>{{ post.text|linebreaksbr }}</p>
            </div>
        {% endfor %}
    </body>
</html>
